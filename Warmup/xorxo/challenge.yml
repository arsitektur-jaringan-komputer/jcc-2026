name: "xorxo"
author: "N/A"
category: "Crypto"
originalScore: 1000
minScoreRate: 0.25
difficulty: 60

description: |
  Luxor is a beautiful city in Egypt. Flag format is `JCC{.*}`.

  Connect using:

      nc HOST PORT

type: "DynamicContainer" # kl static, StaticContainer
provide: "./release" # kalo perlu atatchment

container:
  containerImage: "10.104.0.2:5000/xorxo:latest"
  flagTemplate: "JCC{just_xor_it[TEAM_HASH]}" # dynamic flag set di sini
  exposePort: 5000 # port yg diexpose
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 256
  networkMode: "Isolated"
  enableTrafficCapture: false
