name: "Poly-Auth"
author: "me"
category: "Crypto"

description: |
  Our new polynomial MAC authentication gateway is unbreakable!
  ... right?

type: "DynamicContainer"
provide: "./release"

container:
  containerImage: "10.104.0.2:5000/poly-auth:latest"
  flagTemplate: "JCC{Iphone_kupi_restoran_oplati_Bez_povoda_mne_podari_Koltso_s_moim_imenem_Bazovyy_minimum_[TEAM_HASH]}"
  exposePort: 13424
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 256
  networkMode: "Isolated"
  enableTrafficCapture: false
