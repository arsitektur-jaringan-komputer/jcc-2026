name: "warmup"
author: "idzoyy"
category: "Crypto"

description: |
  Kenapa aku dijauhin? salahku apa? dosaku apa? aku cuma mau punya teman. Pulang nangis, ibu peluk, ayah bilang sabar ya nak.

type: "DynamicContainer"
provide: "./release" # may be omitted

container:
  containerImage: "10.104.0.2:5000/warmup:latest"
  flagTemplate: "JCC{ibu_bilang_pake_ini_dulu_biar_mereka_mau_main_aku_malu_tapi_nurut_aja_[TEAM_HASH]}" # set dynamic flag format here. Ensure it ends with "_[TEAM_HASH]"
  exposePort: 5000 # port to expose
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 256
  networkMode: "Isolated"
  enableTrafficCapture: false
