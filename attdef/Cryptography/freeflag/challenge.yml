name: "freeflag"
author: "idzoyy"

description: |
  request ticket to get the free flag

type: "AttackDefense"

container:
  exposePort: 5555 # adjust me
  memoryLimit: 64
  cpuCount: 1
  storageLimit: 256

ad:
  checkerImage: "checkers/freeflag:latest" # replace "notepad" with your challenge name
  allowEgress: true
  allowSelfReset: true

provide: "./release"
